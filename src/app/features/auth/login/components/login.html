<!-- We use Bootstrap flexbox to center everything vertically and horizontally -->
<div class="login-page d-flex align-items-center justify-content-center vh-100">
  
  <!-- The Bootstrap Card with a softer shadow -->
  <div class="card shadow border-0 rounded-lg p-4 custom-card" style="width: 100%; max-width: 450px;">
    
    <div class="card-body">
      <!-- Header -->
      <div class="text-center mb-4">
        <h2 class="fw-bold custom-title">WelfareLink</h2>
        <p class="text-muted">Access your portal</p>
      </div>

      <!-- Error Message Alert -->
      <div *ngIf="errorMessage" class="alert alert-danger text-center border-0" role="alert">
        {{ errorMessage }}
      </div>

      <!-- The Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <!-- Role Selection -->
        <div class="mb-3">
          <label for="userType" class="form-label fw-semibold text-secondary">I am logging in as:</label>
          <select id="userType" class="form-select form-select-lg custom-input" formControlName="userType">
            <option *ngFor="let role of userRoles" [value]="role.id">
              {{ role.label }}
            </option>
          </select>
        </div>

        <!-- Username Input -->
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold text-secondary">Username</label>
          <input 
            type="text" 
            id="username" 
            class="form-control form-control-lg custom-input" 
            formControlName="username" 
            placeholder="Enter your username"
            [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
        </div>

        <!-- Password Input -->
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold text-secondary">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control form-control-lg custom-input" 
            formControlName="password" 
            placeholder="Enter your password"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="btn btn-primary btn-lg w-100 fw-bold custom-btn" 
          [disabled]="loginForm.invalid || isLoading">
          
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          {{ isLoading ? 'Verifying...' : 'Login' }}
        </button>

      </form>

      <!-- CONDITIONAL REGISTER LINK -->
      <div class="mt-4 text-center border-top pt-4">
        <!-- Shows only for Citizens -->
        <div *ngIf="isCitizenSelected">
          <p class="text-muted mb-2">New to WelfareLink?</p>
          <a routerLink="/register" class="btn btn-outline-secondary w-100 fw-bold custom-btn-outline">Register as a Citizen</a>
        </div>
        
        <!-- Shows for Staff Roles -->
        <div *ngIf="!isCitizenSelected">
          <small class="text-muted" style="font-size: 0.85rem;">
            Staff accounts are provisioned by System Administrators.
          </small>
        </div>
      </div>

    </div>
  </div>
</div>
