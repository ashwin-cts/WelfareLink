<app-program-manager-navbar *ngIf="userRole === 'ProgramManager'"></app-program-manager-navbar>


<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow border-0 rounded-3">
        <div class="card-header text-white py-3 rounded-top-3"
            style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
            <h5 class="mb-0"><i class="bi bi-shield-lock me-2"></i> Security Settings</h5>
        </div>

        <div class="card-body p-4">
            <div *ngIf="successMessage" class="alert alert-success shadow-sm">{{ successMessage }}</div>
            <div *ngIf="errorMessage" class="alert alert-danger shadow-sm">{{ errorMessage }}</div>

            <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">

                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary">Current Password</label>
                    <div class="input-group">
                        <input [type]="showCurrent ? 'text' : 'password'" class="form-control border-end-0 shadow-none"
                            formControlName="currentPassword" placeholder="Enter current password">
                        <span class="input-group-text bg-white border-start-0 text-muted" style="cursor: pointer;"
                            (click)="toggleVisibility('current')">
                            <i class="bi" [ngClass]="showCurrent ? 'bi-eye-slash text-primary' : 'bi-eye'"></i>
                        </span>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">New Password</label>
                    <div class="input-group">
                        <input [type]="showNew ? 'text' : 'password'" class="form-control border-end-0 shadow-none"
                            formControlName="newPassword" placeholder="Create new password">
                        <span class="input-group-text bg-white border-start-0 text-muted" style="cursor: pointer;"
                            (click)="toggleVisibility('new')">
                            <i class="bi" [ngClass]="showNew ? 'bi-eye-slash text-primary' : 'bi-eye'"></i>
                        </span>
                    </div>
                    <div class="form-text mt-2 text-danger"
                        *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid">
                        <i class="bi bi-info-circle me-1"></i> Min 8 chars, 1 uppercase, 1 lowercase, 1 number, 1
                        special character.
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary">Confirm New Password</label>
                    <div class="input-group"
                        [ngClass]="{'border border-danger rounded': passwordForm.hasError('passwordMismatch') && passwordForm.get('confirmPassword')?.touched}">
                        <input [type]="showConfirm ? 'text' : 'password'" class="form-control border-end-0 shadow-none"
                            formControlName="confirmPassword" placeholder="Confirm new password">
                        <span class="input-group-text bg-white border-start-0 text-muted" style="cursor: pointer;"
                            (click)="toggleVisibility('confirm')">
                            <i class="bi" [ngClass]="showConfirm ? 'bi-eye-slash text-primary' : 'bi-eye'"></i>
                        </span>
                    </div>
                    <div *ngIf="passwordForm.hasError('passwordMismatch') && passwordForm.get('confirmPassword')?.touched"
                        class="text-danger small mt-1 fw-bold">
                        <i class="bi bi-exclamation-triangle me-1"></i> Passwords do not match!
                    </div>
                </div>
                <button type="submit" class="btn w-100 fw-bold text-white py-2 shadow-sm"
                    style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); border: none; transition: all 0.3s ease;"
                    [disabled]="passwordForm.invalid || isLoading" onmouseover="this.style.opacity='0.9'"
                    onmouseout="this.style.opacity='1'">
                    <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                    <i *ngIf="!isLoading" class="bi bi-check2-circle me-2"></i> Update Password
                </button>
            </form>
        </div>
    </div>
</div>
