<app-program-manager-navbar></app-program-manager-navbar>

<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white py-3">
            <h5 class="mb-0"><i class="bi bi-shield-lock me-2"></i> Change Password</h5>
        </div>
        <div class="card-body p-4">
            <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
            <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

            <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
                <div class="mb-3">
                    <label class="form-label fw-bold">Current Password</label>
                    <input type="password" class="form-control" formControlName="currentPassword">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">New Password</label>
                    <input type="password" class="form-control" formControlName="newPassword">
                    <div class="form-text text-muted" style="font-size: 0.8rem;">
                        Min 8 chars, 1 uppercase, 1 lowercase, 1 number, 1 special character.
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Confirm New Password</label>
                    <input type="password" class="form-control" formControlName="confirmPassword">
                </div>

                <button type="submit" class="btn btn-dark w-100 fw-bold" [disabled]="passwordForm.invalid || isLoading">
                    <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                    Update Password
                </button>
            </form>
        </div>
    </div>
</div>
