<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" (click)="goToDashboard($event)" style="cursor: pointer;">
      <i class="bi bi-shield-check me-2"></i>WelfareLink Auditor
    </a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#auditorNavbar">
      <span class="navbar-toggler-icon"></span>

    <div class="collapse navbar-collapse" id="auditorNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" 
             (click)="goToDashboard($event)" 
             [class.active]="router.url === '/auditor-dashboard'" 
             style="cursor: pointer;">Dashboard</a>
        </li>
      </ul>
      
      <div class="d-flex align-items-center">
        <div class="dropdown">
          <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center"

                  (click)="toggleDropdown()">
            <i class="bi bi-person-circle me-2 fs-5"></i>
            <span>{{ userName }}</span>
          </button>
          
          <ul class="dropdown-menu dropdown-menu-end shadow border-0 position-absolute" [class.show]="isDropdownOpen"style="right: 0; left: auto;">

                <i class="bi bi-person-lines-fill me-2"></i> Account Settings
              </a>
            </li>
            
            <li><hr class="dropdown-divider"></li>
            
            <li>
              <button class="dropdown-item text-danger" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i> Logout
